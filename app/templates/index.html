<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Counseling Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Import Three.js & TalkingHead JS -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/talkinghead@1.2.0/dist/talkinghead.mjs" type="module"></script>
</head>
<body>
    <div id="app">
        <div id="start-screen" class="card">
            <h1>AI Counseling</h1>
            <p>Pilih mode konseling untuk memulai:</p>
            <div class="mode-selection">
                <button class="mode-btn active" data-mode="efficient">Mode Efficient (Web Audio)</button>
                <button class="mode-btn" data-mode="premium">Mode Premium (ElevenLabs)</button>
            </div>
            <button id="start-btn" class="primary-btn">Mulai Sesi Konseling</button>
        </div>

        <div id="session-screen" class="card hidden">
            <div class="session-header">
                <span id="mode-tag">Mode: EFFICIENT</span>
                <button id="end-session-btn" class="danger-btn">Akhiri Sesi</button>
            </div>
            
            <div id="avatar-container" style="width: 100%; height: 220px; position: relative; margin: 10px 0;">
                <div id="avatar-display" style="width: 100%; height: 100%;"></div>
            </div>
            <div id="avatar-state-text" style="text-align: center; font-weight: bold; margin-bottom: 10px;">State: IDLE</div>

            <div id="chat-history" class="chat-box"></div>

            <div id="efficient-controls" class="controls">
                <button id="hold-speak-btn" class="secondary-btn">🎤 Tahan untuk Bicara</button>
            </div>

            <div id="premium-controls" class="controls hidden">
                <button id="toggle-call-btn" class="call-btn">📞 Start Voice Call</button>
            </div>

            <div class="input-group">
                <input type="text" id="message-input" placeholder="Tulis pesan Anda di sini...">
                <button id="send-btn" class="primary-btn">Kirim</button>
            </div>
        </div>
    </div>
    <script src="https://assets.discord.com/sdk/v1/discord-sdk.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
