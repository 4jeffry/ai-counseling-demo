<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Counselor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Load ElevenLabs JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@elevenlabs/client@latest/dist/index.umd.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
    }

    /* Header Info */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .status-info h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-info p {
      font-size: 0.8rem;
      color: var(--tg-theme-hint-color, #94a3b8);
    }

    /* Area Chat Transcript */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .msg.agent {
      background: rgba(255, 255, 255, 0.08);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: #0284c7;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-top: 12px;
    }

    .call-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #22c55e;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .call-btn.active {
      background: #ef4444;
    }

    .call-btn:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="chat-header">
    <div class="avatar">AI</div>
    <div class="status-info">
      <h2>AI Counselor</h2>
      <p id="call-status">Siap berkonsultasi</p>
    </div>
  </div>

  <div class="chat-box" id="chat-box">
    <div class="msg agent">Halo, aku AI Counselor. Apa yang lagi kamu rasain hari ini?</div>
  </div>

  <div class="controls-bar">
    <button id="start-btn" class="call-btn">
      <span id="btn-text">Mulai Sesi Suara</span>
    </button>
  </div>

  <script>
    const AGENT_ID = "ISI_AGENT_ID";
    let conversation = null;
    let isConnected = false;

    const startBtn = document.getElementById('start-btn');
    const btnText = document.getElementById('btn-text');
    const callStatus = document.getElementById('call-status');
    const chatBox = document.getElementById('chat-box');

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function toggleConversation() {
      if (isConnected) {
        if (conversation) {
          await conversation.endSession();
        }
        return;
      }

      try {
        // Minta izin mikrofon
        await navigator.mediaDevices.getUserMedia({ audio: true });

        // Pakai ElevenLabs JS Client SDK
        conversation = await ElevenLabsClient.Conversation.startSession({
          agentId: AGENT_ID,
          onConnect: () => {
            isConnected = true;
            callStatus.innerText = "Terhubung (Mendengarkan...)";
            btnText.innerText = "Akhiri Sesi";
            startBtn.classList.add('active');
          },
          onDisconnect: () => {
            isConnected = false;
            callStatus.innerText = "Sesi Berakhir";
            btnText.innerText = "Mulai Sesi Suara";
            startBtn.classList.remove('active');
          },
          onMessage: (message) => {
            if (message.source === 'user') {
              appendMessage('user', message.message);
            } else if (message.source === 'ai') {
              appendMessage('agent', message.message);
            }
          },
          onError: (error) => {
            console.error("SDK Error:", error);
            callStatus.innerText = "Gagal terhubung";
          }
        });
      } catch (err) {
        alert("Gagal mengakses mikrofon atau terhubung ke server.");
        console.error(err);
      }
    }

    startBtn.addEventListener('click', toggleConversation);

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
